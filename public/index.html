<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
	<title>직업 대전</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

		:root {
			--bg: #0a0a0f;
			--fg: #e2e8f0;
			--btn: #1e1e2f;
			--acc: #f43f5e;
			box-sizing: border-box;
			padding-top: env(safe-area-inset-top, 0px);
			padding-bottom: env(safe-area-inset-bottom, 0px);
		}

		* {
			box-sizing: inherit;
			font-family: 'Inter', sans-serif;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: var(--bg);
			color: var(--fg);
			overflow: hidden;
		}

		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			user-select: none;
			-webkit-user-select: none;
			touch-action: none;
		}

		#game-container {
			position: relative;
			width: 100%;
			max-width: 960px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 15px;
		}

		canvas {
			width: 100%;
			max-width: 900px;
			aspect-ratio: 600/280;
			image-rendering: pixelated;
			display: block;
			background: #000;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(244, 63, 94, 0.25);
		}

		#sel {
			position: absolute;
			inset: 0;
			max-width: 800px;
			margin: 0 auto;
			background: rgba(10, 8, 15, 0.95);
			backdrop-filter: blur(5px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 15px;
			border-radius: 12px;
			z-index: 10;
		}

		#sel-title {
			font-size: 24px;
			font-weight: 900;
			color: #fff;
			text-shadow: 0 0 10px var(--acc);
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		#jb {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			gap: 8px;
			width: 94%;
			max-width: 760px;
			max-height: 280px;
			overflow-y: auto;
			padding-right: 4px;
		}

		#jb button {
			height: auto;
			min-height: 60px;
			padding: 6px;
			text-align: left;
			font-size: 10px;
			line-height: 1.3;
			border-radius: 8px;
			background: rgba(30, 30, 45, 0.8);
			border: 1px solid rgba(255, 255, 255, 0.1);
			color: #ccc;
			transition: all 0.2s;
			cursor: pointer;
		}

		#jb button b {
			font-size: 12px;
			color: #fff;
			display: block;
			margin-bottom: 2px;
		}

		#jb button:hover {
			background: rgba(50, 50, 75, 0.9);
			border-color: var(--acc);
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
		}

		#jb button:active {
			transform: translateY(1px);
		}

		#pad {
			width: 100%;
			max-width: 800px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 0 10px;
			gap: 20px;
		}

		.dp,
		.ac {
			display: grid;
			gap: 8px;
		}

		.dp {
			grid-template-columns: 65px 65px 65px;
			grid-template-rows: 65px 65px;
		}

		.ac {
			grid-template-columns: 75px 75px;
			grid-template-rows: 65px 75px;
		}

		button.btn {
			background: var(--btn);
			color: #fff;
			border: 0;
			border-radius: 50%;
			font-weight: 700;
			font-size: 16px;
			touch-action: none;
			box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3), 0 4px 6px rgba(0, 0, 0, 0.4);
			text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
			cursor: pointer;
		}

		button.btn:active {
			filter: brightness(1.2);
			box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3), 0 2px 3px rgba(0, 0, 0, 0.4);
			transform: translateY(2px);
		}

		.dp .u {
			grid-column: 2;
			grid-row: 1;
			border-radius: 12px;
		}

		.dp .l {
			grid-column: 1;
			grid-row: 2;
			border-radius: 12px;
		}

		.dp .d {
			grid-column: 2;
			grid-row: 2;
			background: #2a6a6a;
			border-radius: 12px;
			font-size: 14px;
		}

		.dp .r {
			grid-column: 3;
			grid-row: 2;
			border-radius: 12px;
		}

		.ac .s {
			background: #a87a1f;
			grid-column: 2;
			grid-row: 1;
		}

		.ac .h {
			background: #b03a2e;
			grid-column: 1;
			grid-row: 2;
			border-radius: 12px;
			width: 100%;
		}

		.ac .a {
			background: #2f6fd0;
			grid-column: 2;
			grid-row: 2;
			border-radius: 12px;
			width: 100%;
		}

		.overlay {
			position: absolute;
			inset: 0;
			max-width: 800px;
			margin: 0 auto;
			background: rgba(10, 8, 15, 0.95);
			backdrop-filter: blur(5px);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 15px;
			border-radius: 12px;
			z-index: 10;
		}

		.title-large {
			font-size: 36px;
			font-weight: 900;
			color: #fff;
			text-shadow: 0 0 15px var(--acc);
			letter-spacing: 2px;
			text-align: center;
			line-height: 1.2;
			margin-bottom: 20px;
		}

		.title-large span {
			font-size: 20px;
			color: var(--acc);
		}

		/* 첫 화면 제목과 메뉴가 검은 게임 화면 밖으로 밀려나지 않도록 보정 */
		#main-menu {
			padding: 14px 12px;
			overflow-y: auto;
			overscroll-behavior: contain;
			-webkit-overflow-scrolling: touch;
			justify-content: safe center;
			touch-action: pan-y;
		}

		#main-menu .title-large {
			font-size: clamp(28px, 4vw, 34px);
			line-height: 1.12;
			margin: 0 0 12px;
			flex: 0 0 auto;
		}

		#main-menu .title-large span {
			display: inline-block;
			font-size: clamp(16px, 2.2vw, 19px);
			margin-top: 3px;
		}

		#main-menu .menu-btns {
			flex-shrink: 0;
		}

		#main-menu .controls-info {
			margin-top: 12px;
			padding: 11px;
			font-size: 12px;
			line-height: 1.55;
		}

		.menu-btns {
			display: flex;
			flex-direction: column;
			gap: 12px;
			width: 280px;
		}

		.menu-btn {
			background: rgba(30, 30, 45, 0.8);
			border: 2px solid var(--acc);
			color: #fff;
			padding: 14px;
			font-size: 16px;
			font-weight: 900;
			border-radius: 8px;
			cursor: pointer;
			transition: 0.2s;
			text-align: center;
			text-transform: uppercase;
			box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
			font-family: 'Inter', sans-serif;
		}

		.menu-btn:hover {
			background: var(--acc);
			color: #fff;
			box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
			transform: translateY(-2px);
		}

		.menu-btn:active {
			transform: translateY(1px);
		}

		.menu-btn.small {
			padding: 8px 16px;
			font-size: 12px;
			width: auto;
			border-width: 1px;
		}

		.controls-info {
			font-size: 13px;
			color: #aaa;
			text-align: center;
			margin-top: 25px;
			line-height: 1.7;
			background: rgba(0, 0, 0, 0.4);
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #333;
		}

		.controls-info b {
			color: #fff;
		}

		#btn-pause {
			background: rgba(10, 8, 15, 0.7);
			border: 1px solid rgba(255, 255, 255, 0.3);
			color: #fff;
			padding: 6px 12px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			font-weight: bold;
			transition: 0.2s;
			backdrop-filter: blur(3px);
		}

		#btn-pause:hover {
			background: rgba(255, 255, 255, 0.2);
			border-color: #fff;
		}

		@media (max-height: 700px) {
			#main-menu {
				justify-content: flex-start;
				gap: 10px;
			}

			#main-menu .title-large {
				font-size: 30px;
				margin-bottom: 4px;
			}

			#main-menu .controls-info {
				margin-top: 4px;
			}
		}

		@media (max-width: 600px) {
			#main-menu {
				justify-content: flex-start;
				gap: 9px;
				padding: 10px;
			}

			#main-menu .title-large {
				font-size: clamp(25px, 7vw, 30px);
				margin-bottom: 2px;
			}

			#main-menu .title-large span {
				font-size: clamp(14px, 4vw, 17px);
			}

			#main-menu .menu-btns {
				width: min(280px, 100%);
				gap: 8px;
			}

			#main-menu .menu-btn {
				padding: 10px;
				font-size: 14px;
			}

			#main-menu .controls-info {
				font-size: 11px;
				padding: 9px;
				margin-top: 2px;
			}

			#jb {
				grid-template-columns: repeat(3, 1fr);
			}

			.dp {
				grid-template-columns: 55px 55px 55px;
				grid-template-rows: 55px 55px;
			}

			.ac {
				grid-template-columns: 65px 65px;
				grid-template-rows: 55px 65px;
			}

			button.btn {
				font-size: 14px;
			}
		}
	</style>
</head>

<body>
	<div id="game-container">
		<canvas id="c" width="600" height="280"></canvas>

		<div id="main-menu" class="overlay">
			<div class="title-large">직업 대전<br><span>NEON CITY REMASTERED</span></div>
			<div class="menu-btns">
				<button id="btn-start" class="menu-btn">LOCAL MULTIPLAYER / CPU</button>
				<button id="btn-mode" class="menu-btn">MODE: CPU BATTLE</button>
				<button id="btn-diff" class="menu-btn" style="border-color:#ff00ff; color:#ff00ff;">DIFFICULTY:
					NORMAL</button>
				<button id="btn-host" class="menu-btn" style="border-color:#00ffff; color:#00ffff;">ONLINE PVP:
					HOST</button>
				<button id="btn-join" class="menu-btn" style="border-color:#00ffff; color:#00ffff;">ONLINE PVP:
					JOIN</button>
				<div id="user-stats"
					style="color: #00ffff; font-size: 14px; text-align: center; margin-top: 5px; font-weight: bold; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);">
					온라인 전적: 불러오는 중...</div>
			</div>
			<div class="controls-info">
				<b>[P1]</b> WASD 이동 (W 점프, S 가드) / J 약, K 강, L 스킬 / 더블탭 또는 방향 대시<br>
				<b>[P2]</b> 방향키 이동 (↑ 점프, ↓ 가드) / Num1 약, Num2 강, Num3 스킬<br>
				<b>[ESC]</b> 일시정지 메뉴
			</div>
		</div>

		<div id="sel" class="overlay" style="display:none;">
			<div id="sel-title">P1 SELECT</div>
			<div id="jb"></div>
			<button id="btn-back-main" class="menu-btn small" style="margin-top: 15px;">MAIN MENU</button>
		</div>

		<div id="pause-menu" class="overlay" style="display:none;">
			<div class="title-large">PAUSED</div>
			<div class="menu-btns">
				<button id="btn-resume" class="menu-btn">RESUME</button>
				<button id="btn-to-sel" class="menu-btn">CHARACTER SELECT</button>
				<button id="btn-to-main" class="menu-btn">MAIN MENU</button>
			</div>
		</div>

		<div id="online-lobby" class="overlay" style="display:none;">
			<div class="title-large" id="lobby-title">ONLINE PVP</div>
			<div id="lobby-info"
				style="color:#fff; font-size:18px; text-align:center; margin-bottom:20px; white-space:pre-wrap;"></div>
			<input type="text" id="room-input" placeholder="Enter Room ID"
				style="display:none; padding:10px; font-size:16px; border-radius:6px; border:2px solid #00ffff; background:rgba(0,0,0,0.5); color:#fff; text-align:center; margin-bottom:15px; width:80%;">
			<div class="menu-btns">
				<button id="btn-room-action" class="menu-btn" style="display:none;">JOIN ROOM</button>
				<button id="btn-lobby-cancel" class="menu-btn small">CANCEL</button>
			</div>
		</div>

		<button id="btn-pause" style="display:none; position:absolute; top: 15px; right: 15px; z-index: 5;">⏸
			ESC</button>

		<div id="pad">
			<div class="dp">
				<button class="btn u" data-k="up">▲</button>
				<button class="btn l" data-k="left">◀</button>
				<button class="btn d" data-k="b">가드</button>
				<button class="btn r" data-k="right">▶</button>
			</div>
			<div class="ac">
				<button class="btn s" data-k="s">스킬</button>
				<button class="btn h" data-k="h">강공격</button>
				<button class="btn a" data-k="l">약공격</button>
			</div>
		</div>
	</div>

	<script type="module">

		const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 600, H = 280, GY = 230, KS = 1.25;
		g.imageSmoothingEnabled = false;

		const J = {
			police: { n: '경찰', hp: 120, sp: 1.35, col: '#2f4f9e', L: { su: 4, ac: 3, rc: 10, d: 6, s: 13, r: 28 }, H: { su: 12, ac: 4, rc: 20, d: 15, s: 22, r: 36, gb: 1, leg: 1 }, tx: '균형형 · 방패 돌진' },
			chef: { n: '요리사', hp: 105, sp: 1.55, col: '#f2f2f2', L: { su: 4, ac: 3, rc: 8, d: 5, s: 12, r: 26 }, H: { su: 10, ac: 4, rc: 18, d: 13, s: 20, r: 32, gb: 1 }, tx: '속공형 · 칼 3연발' },
			doctor: { n: '의사', hp: 100, sp: 1.60, col: '#e8f1f5', L: { su: 4, ac: 3, rc: 9, d: 5, s: 12, r: 30 }, H: { su: 11, ac: 3, rc: 19, d: 12, s: 19, r: 35 }, tx: '기교형 · 바이탈 치료' },
			fire: { n: '소방관', hp: 145, sp: 1.20, col: '#c8402a', L: { su: 5, ac: 3, rc: 12, d: 7, s: 14, r: 30 }, H: { su: 15, ac: 4, rc: 24, d: 19, s: 26, r: 38, gb: 1 }, tx: '중장갑 · 고압 물대포' },
			boxer: { n: '복서', hp: 100, sp: 1.80, col: '#d9a27a', L: { su: 3, ac: 2, rc: 6, d: 4, s: 10, r: 24 }, H: { su: 9, ac: 3, rc: 15, d: 12, s: 18, r: 28 }, tx: '초속공 · 어퍼컷 러시' },
			soldier: { n: '군인', hp: 115, sp: 1.35, col: '#4d5a32', L: { su: 4, ac: 3, rc: 10, d: 6, s: 13, r: 26 }, H: { su: 13, ac: 4, rc: 21, d: 14, s: 21, r: 32, gb: 1, leg: 1 }, tx: '원거리 · 수류탄 폭격' },
			magician: { n: '마술사', hp: 100, sp: 1.65, col: '#2b2040', L: { su: 3, ac: 3, rc: 8, d: 5, s: 12, r: 30 }, H: { su: 11, ac: 3, rc: 18, d: 13, s: 21, r: 40 }, tx: '기교형 · 분신 순간이동' },
			baseball: { n: '야구선수', hp: 120, sp: 1.40, col: '#f4f4f4', L: { su: 5, ac: 3, rc: 10, d: 6, s: 13, r: 32 }, H: { su: 14, ac: 4, rc: 24, d: 16, s: 24, r: 40, gb: 1 }, tx: '강타형 · 반사 스윙' },
			swordsman: { n: '검객', hp: 105, sp: 1.60, col: '#2a3a5a', L: { su: 3, ac: 3, rc: 8, d: 6, s: 12, r: 32 }, H: { su: 11, ac: 4, rc: 18, d: 14, s: 22, r: 40, gb: 1 }, tx: '속공형 · 질풍 연참' },
			idol: { n: '아이돌', hp: 95, sp: 1.70, col: '#ff7ac8', L: { su: 3, ac: 3, rc: 8, d: 5, s: 12, r: 26 }, H: { su: 11, ac: 4, rc: 18, d: 12, s: 20, r: 30, gb: 1, leg: 1 }, tx: '원거리 · 매혹 음파' },
			smith: { n: '대장장이', hp: 155, sp: 1.20, col: '#6a4a3a', L: { su: 6, ac: 3, rc: 13, d: 8, s: 15, r: 30 }, H: { su: 17, ac: 4, rc: 26, d: 21, s: 28, r: 38, gb: 1 }, tx: '슈퍼아머 · 대지 강타' },
			barista: { n: '바리스타', hp: 100, sp: 1.60, col: '#e8d8c0', L: { su: 3, ac: 3, rc: 8, d: 5, s: 12, r: 26 }, H: { su: 10, ac: 4, rc: 18, d: 11, s: 19, r: 30 }, tx: '견제형 · 핫커피 지대' },
			bodyguard: { n: '경호원', hp: 130, sp: 1.35, col: '#1a1a22', L: { su: 4, ac: 3, rc: 10, d: 6, s: 13, r: 28 }, H: { su: 12, ac: 4, rc: 20, d: 14, s: 22, r: 36, gb: 1 }, S: { t: 'parry', su: 3, ac: 0, rc: 24, v: 35, cd: 480, rng: [10, 50] }, tx: '철벽 · 카운터 패리' },
			engineer: { n: '엔지니어', hp: 95, sp: 1.55, col: '#e0a020', L: { su: 4, ac: 3, rc: 8, d: 5, s: 12, r: 30 }, H: { su: 11, ac: 4, rc: 19, d: 12, s: 20, r: 36 }, S: { t: 'turret', su: 12, ac: 0, rc: 14, v: 260, cd: 840, rng: [45, 170] }, tx: '설치형 · 자동 터렛' },
			ninja: { n: '닌자', hp: 90, sp: 1.90, col: '#2a2a3a', L: { su: 2, ac: 2, rc: 7, d: 5, s: 11, r: 26 }, H: { su: 9, ac: 3, rc: 15, d: 11, s: 18, r: 30, leg: 1 }, S: { t: 'stealth', su: 4, ac: 0, rc: 8, v: 180, cd: 600, rng: [50, 220] }, tx: '은신 기습' },
			dj: { n: 'DJ', hp: 105, sp: 1.55, col: '#7a3aa8', L: { su: 3, ac: 3, rc: 9, d: 5, s: 12, r: 26 }, H: { su: 11, ac: 4, rc: 20, d: 13, s: 20, r: 32, gb: 1 }, S: { t: 'pulse', su: 7, ac: 0, rc: 18, d: 9, s: 24, cd: 480, rng: [0, 60] }, tx: '사운드 충격파' },
			delivery: { n: '배달원', hp: 110, sp: 1.80, col: '#00cc66', L: { su: 3, ac: 3, rc: 8, d: 5, s: 12, r: 28 }, H: { su: 10, ac: 3, rc: 18, d: 13, s: 20, r: 34, leg: 1 }, S: { t: 'dash', su: 5, ac: 10, rc: 14, d: 14, s: 28, r: 36, v: 6, mh: 4, cd: 420, rng: [20, 120] }, tx: '기동형 · 헬멧 돌진' },

				socket.addEventListener('error', () => {
					console.error('[Realtime] WebSocket 연결 오류');
					if (!authenticated) finish(new Error('Cloudflare 실시간 서버에 연결하지 못했습니다. Worker 주소와 배포 상태를 확인해 주세요.'));
				});

				socket.addEventListener('close', (event) => {
					if (!authenticated) {
						finish(new Error(`실시간 연결이 인증 전에 종료되었습니다. (코드 ${event.code})`));
					}
					if (dc === socket) dc = null;
					if (roomCode && onlineLobby && onlineLobby.style.display !== 'none') {
						lobbyInfo.textContent = '실시간 연결이 종료되었습니다. 새 방을 만들어 다시 접속해 주세요.';
					}
					if (socketConnectPromise === connectPromise) socketConnectPromise = null;
				});
			});
			socketConnectPromise = connectPromise;

			return connectPromise;
		}

		function enterOnlineCharacterSelection() {
			if (onlineSelectionStarted) return;
			onlineSelectionStarted = true;
			console.info('[Realtime] 양쪽 플레이어가 연결되었습니다. 캐릭터 선택을 시작합니다.');
			st = 'select'; jobs = []; P = null; localSelectedJob = null; remoteSelectedJob = null;
			sel.style.display = 'flex'; mainMenu.style.display = 'none';
			onlineLobby.style.display = 'none';
			selTitle.textContent = 'SELECT YOUR CHARACTER';
		}

		function sendRealtimeGame(data) {
			if (!dc || dc.readyState !== WebSocket.OPEN) return false;
			try {
				dc.send(JSON.stringify({ type: 'game', data }));
				return true;
			} catch (error) {
				console.warn('게임 데이터를 전송하지 못했습니다:', error);
				return false;
			}
		}

		function handleGameMessage(msg) {
			if (!msg || typeof msg !== 'object') return;
			if (msg.t === 'sel') {
				remoteSelectedJob = msg.job;
				if (localSelectedJob && remoteSelectedJob) {
					jobs = localPlayerIndex === 0 ? [localSelectedJob, remoteSelectedJob] : [remoteSelectedJob, localSelectedJob];
					sel.style.display = 'none'; btnPause.style.display = 'block'; reset(true);
				}
			} else if (msg.t === 'in') {
				inp[remotePlayerIndex] = msg.k;
			} else if (msg.t === 'sync' && localPlayerIndex === 1) {
				if (P) {
					if (msg.p0) { P[0].x = msg.p0.x; P[0].y = msg.p0.y; P[0].hp = msg.p0.hp; P[0].gStam = msg.p0.gStam; P[0].face = msg.p0.face; }
					if (msg.p1) { P[1].x = msg.p1.x; P[1].y = msg.p1.y; P[1].hp = msg.p1.hp; P[1].gStam = msg.p1.gStam; P[1].face = msg.p1.face; }
				}
			}
		}

		async function hostRoom() {
			try {
				await doAuth();
				const room = await apiRequest('/rooms', { method: 'POST', body: {} });
				roomCode = room.code;
				onlineRole = 'host';
				onlineSelectionStarted = false;
				lobbyInfo.textContent = `방 번호: [ ${roomCode} ]\n실시간 서버에 접속하고 있습니다...`;
				await connectRealtimeSocket();
				if (!onlineSelectionStarted) {
					lobbyInfo.textContent = `방 번호: [ ${roomCode} ]\n상대 플레이어의 접속을 기다리고 있습니다...`;
				}
			} catch (error) {
				lobbyInfo.textContent = `방 생성 오류: ${error.message}`;
				console.error('방 생성/실시간 접속 실패:', error);
				if (dc) { try { dc.close(); } catch {} dc = null; }
				if (roomCode && playerToken) {
					apiRequest(`/rooms/${encodeURIComponent(roomCode)}/leave`, { method: 'POST', body: {} }).catch(() => {});
				}
			}
		}

		async function joinRoom(code) {
			try {
				lobbyInfo.textContent = '대전방을 확인하고 있습니다...';
				await doAuth();
				const normalizedCode = String(code).trim();
				await apiRequest(`/rooms/${encodeURIComponent(normalizedCode)}/join`, { method: 'POST', body: {} });
				roomCode = normalizedCode;
				onlineRole = 'guest';
				onlineSelectionStarted = false;
				lobbyInfo.textContent = 'Cloudflare 실시간 서버에 접속하고 있습니다...';
				await connectRealtimeSocket();
				if (!onlineSelectionStarted) lobbyInfo.textContent = '방장과 연결되었습니다. 게임을 준비하고 있습니다...';
			} catch (error) {
				lobbyInfo.textContent = `참가 오류: ${error.message}`;
				console.error('방 참가/실시간 접속 실패:', error);
				if (dc) { try { dc.close(); } catch {} dc = null; }
				if (roomCode && playerToken) {
					apiRequest(`/rooms/${encodeURIComponent(roomCode)}/leave`, { method: 'POST', body: {} }).catch(() => {});
				}
			}
		}

		window.extractState = function (obj) {
			return { x: obj.x, y: obj.y, hp: obj.hp, gStam: obj.gStam, face: obj.face };
		};

		function showMainMenu() {
			st = 'main';
			if (roomCode && playerToken) {
				apiRequest(`/rooms/${encodeURIComponent(roomCode)}/leave`, { method: 'POST', body: {} }).catch(() => { });
			}
			roomCode = null; onlineRole = null; onlineSelectionStarted = false; socketConnectPromise = null;
			if (dc) { try { dc.close(); } catch { /* ignored */ } dc = null; }
			mainMenu.style.display = 'flex'; sel.style.display = 'none'; pauseMenu.style.display = 'none'; btnPause.style.display = 'none'; onlineLobby.style.display = 'none';
			loadStats();
		}

		function showSel() {
			st = 'select'; jobs = []; P = null; localSelectedJob = null; remoteSelectedJob = null;
			sel.style.display = 'flex'; mainMenu.style.display = 'none'; pauseMenu.style.display = 'none'; btnPause.style.display = 'none'; onlineLobby.style.display = 'none';
			selTitle.textContent = 'P1 CHARACTER SELECT';
		}

		document.getElementById('btn-start').onclick = showSel;
		document.getElementById('btn-mode').onclick = e => {
			mode = mode === 'cpu' ? '2p' : 'cpu';
			e.target.textContent = 'MODE: ' + (mode === 'cpu' ? 'CPU BATTLE' : '2P BATTLE');
			document.getElementById('btn-diff').style.display = mode === 'cpu' ? 'block' : 'none';
		};

		document.getElementById('btn-diff').onclick = e => {
			diffIdx = (diffIdx + 1) % DIFF_LEVELS.length;
			e.target.textContent = 'DIFFICULTY: ' + DIFF_LEVELS[diffIdx];
		};

		document.getElementById('btn-host').onclick = () => {
			mode = 'online'; localPlayerIndex = 0; remotePlayerIndex = 1;
			mainMenu.style.display = 'none'; onlineLobby.style.display = 'flex';
			lobbyTitle.textContent = 'HOSTING GAME'; roomInput.style.display = 'none'; btnRoomAction.style.display = 'none';
			hostRoom();
		};

		document.getElementById('btn-join').onclick = () => {
			mode = 'online'; localPlayerIndex = 1; remotePlayerIndex = 0;
			mainMenu.style.display = 'none'; onlineLobby.style.display = 'flex';
			lobbyTitle.textContent = 'JOIN GAME'; roomInput.style.display = 'block'; btnRoomAction.style.display = 'block';
			lobbyInfo.textContent = 'Enter the Host\'s Room ID';
			roomInput.value = '';
		};

		document.getElementById('btn-room-action').onclick = () => {
			const id = roomInput.value.trim();
			if (id) joinRoom(id);
		};

		document.getElementById('btn-lobby-cancel').onclick = showMainMenu;
		document.getElementById('btn-back-main').onclick = showMainMenu;

		document.getElementById('btn-pause').onclick = () => {
			if (st === 'main' || st === 'select' || st === 'end') return;
			prevState = st; st = 'pause';
			pauseMenu.style.display = 'flex'; btnPause.style.display = 'none';
		};
		document.getElementById('btn-resume').onclick = () => {
			st = prevState; pauseMenu.style.display = 'none'; btnPause.style.display = 'block';
		};
		document.getElementById('btn-to-sel').onclick = showSel;
		document.getElementById('btn-to-main').onclick = showMainMenu;

		Object.keys(J).forEach(k => {
			const b = document.createElement('button');
			b.innerHTML = '<b>' + J[k].n + '</b>' + J[k].tx;
			b.onclick = () => {
				if (mode === 'online') {
					if (localSelectedJob) return;
					localSelectedJob = k;
					selTitle.textContent = 'WAITING FOR OPPONENT...';
					sendRealtimeGame({ t: 'sel', job: k });
					if (localSelectedJob && remoteSelectedJob) {
						jobs = localPlayerIndex === 0 ? [localSelectedJob, remoteSelectedJob] : [remoteSelectedJob, localSelectedJob];
						sel.style.display = 'none'; btnPause.style.display = 'block'; reset(true);
					}
				} else {
					jobs.push(k);
					if (mode === 'cpu') { const ks = Object.keys(J); jobs.push(ks[Math.random() * ks.length | 0]); }
					if (jobs.length < 2) { selTitle.textContent = 'P2 CHARACTER SELECT'; return; }
					sel.style.display = 'none'; btnPause.style.display = 'block'; reset(true);
				}
			};
			jb.appendChild(b);
		});

		function press(i, k, d) {
			if (mode === 'online' && i !== localPlayerIndex) return;
			const p = inp[i];
			if (k === 'left') p.L = d; else if (k === 'right') p.R = d; else if (k === 'b') p.b = d;
			else if (d) { if (k === 'up') p.pj = 1; if (k === 'l') p.pl = 1; if (k === 'h') p.ph = 1; if (k === 's') p.ps = 1; }
			p.mv = p.R - p.L;
		}

		document.querySelectorAll('.btn[data-k]').forEach(b => {
			const k = b.dataset.k;
			b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(localPlayerIndex, k, 1); });
			['pointerup', 'pointercancel'].forEach(t => b.addEventListener(t, () => press(localPlayerIndex, k, 0)));
		});

		const K0 = { KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'b', KeyJ: 'l', KeyK: 'h', KeyL: 's' };
		const K1 = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'b', Numpad1: 'l', Numpad2: 'h', Numpad3: 's', Digit1: 'l', Digit2: 'h', Digit3: 's' };

		addEventListener('keydown', e => {
			if (e.repeat) return;
			if (e.code === 'Escape') {
				if (st === 'fight') document.getElementById('btn-pause').click();
				else if (st === 'pause') document.getElementById('btn-resume').click();
				return;
			}
			if (K0[e.code]) { press(0, K0[e.code], 1); e.preventDefault(); }
			if (mode === '2p' && K1[e.code]) { press(1, K1[e.code], 1); e.preventDefault(); }
			if (mode === 'online' && localPlayerIndex === 1 && K1[e.code]) { press(1, K1[e.code], 1); e.preventDefault(); }
		});

		addEventListener('keyup', e => {
			if (K0[e.code]) press(0, K0[e.code], 0);
			if (mode === '2p' && K1[e.code]) press(1, K1[e.code], 0);
			if (mode === 'online' && localPlayerIndex === 1 && K1[e.code]) press(1, K1[e.code], 0);
		});

		cv.addEventListener('pointerdown', () => { if (st === 'end') showSel(); });

		let last = 0, acc = 0;
		function loop(t) {
			acc += Math.min(100, t - last); last = t;
			while (acc >= 16.67) { tick(); acc -= 16.67; }
			render();
			requestAnimationFrame(loop);
		}
		requestAnimationFrame(t => { last = t; loop(t); });

		showMainMenu();
	</script>
</body>

</html>
